# Temporary public archive access while ACME issuance is unavailable.
# Login and mutations are withheld until the HTTPS configuration is activated.
server {
    listen 80;
    listen [::]:80;
    server_name banshi.rubusoo.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location ~ ^/(login|signup|logout|demo-login|system|curation|claims|onebot)(/|$) {
        default_type text/plain;
        return 503 'HTTPS certificate is pending. Please try again later.\n';
    }
    location / {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:3300;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Do not advertise HSTS before HTTPS exists; secure cookies stay enabled.
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header Set-Cookie;
    }
}
